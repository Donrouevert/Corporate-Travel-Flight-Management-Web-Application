<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script>
      (() => { let theme; try { theme = localStorage.getItem('unilever-travel-theme'); } catch {} if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme; })();
    </script>
    <meta name="theme-color" content="#102954"/>
    <meta name="description" content="Better Journeys: Unilever Philippines corporate travel workspace."/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=unilever-1"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=unilever-1"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=unilever-1"/>
    <title>Better Journeys | Corporate Travel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
